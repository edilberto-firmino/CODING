<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizzaria - Faça seu Pedido</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🍕 Pizzaria Delícia</h1>
        <p>Preencha os dados abaixo para fazer seu pedido.</p>

        <form id="formPedido">

            <h2>Dados do cliente</h2>

            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="sabor">Sabor</label>
                <input
                    type="text"
                    id="sabor"
                    placeholder="Digite o sabor da pizza"
                    required
                >
            </div>

            <div class="campo">
                <label for="bordas">Qtd. Bordas</label>
                <input
                    type="number"
                    id="bordas"
                    placeholder="Digite a quantidade de bordas"
                    required
                >
            </div>

            <div class="campo">
                <label for="whatsapp">WhatsApp</label>
                <input
                    type="tel"
                    id="whatsapp"
                    placeholder="(85) 99999-9999"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@email.com"
                    required
                >
            </div>

            <div class="campo">
                <label for="endereco">Endereço</label>
                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, avenida..."
                    required
                >
            </div>

            <div class="campo">
                <label for="numero">Número</label>
                <input
                    type="text"
                    id="numero"
                    placeholder="Número da residência"
                    required
                >
            </div>

            <h2>Seu pedido</h2>

            <div class="campo">
                <label for="pizza">Escolha a pizza</label>

                <select id="pizza" required>
                    <option value="">Selecione...</option>
                    <option value="Calabresa">Calabresa</option>
                    <option value="Mussarela">Mussarela</option>
                    <option value="Frango com Catupiry">Frango com Catupiry</option>
                    <option value="Portuguesa">Portuguesa</option>
                    <option value="Quatro Queijos">Quatro Queijos</option>
                </select>
            </div>

            <div class="campo">
                <label for="recheio">Escolha o recheio</label>

                <select id="recheio" required>
                    <option value="">Selecione...</option>
                    <option value="catupiry">catupiry</option>
                    <option value="cheeddar">cheeddar</option>
                    <option value="cream cheese">cream cheese</option>
                    <option value="maionse">maionse</option>
                    <option value="queijo extra">queijo extra</option>
                </select>
            </div>

            
            <div class="campo">
                <label for="bordas">quantidade de bordas</label>

                <select id="bordas" required>
                    <option value="">Selecione...</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>

                <input
                    type="number"
                    id="quantidade"
                    value="1"
                    min="1"
                    required
                >
            </div>

            <button type="submit">
                Fazer Pedido 🍕
            </button>

        </form>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
